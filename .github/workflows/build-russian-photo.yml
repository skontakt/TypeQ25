name: Build TypeQ25 Russian APK

on:
  push:
    branches:
      - feature/russian-q25-photo-apk
      - master
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-russian-photo.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 (runner SDK)
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            echo "::error::Android SDK command-line tools missing on runner"
            exit 1
          fi
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print -quit)"
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDK_MANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          "$SDK_MANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TypeQ25-Russian-Photo-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
